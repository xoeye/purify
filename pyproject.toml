[project]
name = "purify"
description = "Pythonic object-mutator transforms as pure functions"
authors = [
    { name = "Peter Gaultney", email = "pgaultney@xoi.io" }
]
version = "0.3.0"
requires-python = ">=3.10,<3.15"

[dependency-groups]
dev = [
    "mypy>=1.19.1,<2.0.0",
    "pylint>=4.0.5,<5.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest>=9.0.2,<10.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.black]
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.main]
fail-under = 8.5
ignore = ["tests"] # must match pre-commit

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
