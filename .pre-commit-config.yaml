---
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.2.3
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: flake8
      - id: check-case-conflict
      - id: check-json
      - id: mixed-line-ending
      - id: check-merge-conflict

  - repo: https://github.com/ambv/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: pylint-uv
        name: pylint-uv
        entry: uv run pylint
        language: system
        types: [python]
        require_serial: true
        exclude: ^(tests)/
        args:
          - --fail-under 8.5

  - repo: local
    hooks:
      - id: mypy-uv
        name: mypy-uv
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        exclude: ^(tests)/
        args:
          - --show-traceback
          - --ignore-missing-imports
          - --check-untyped-defs
